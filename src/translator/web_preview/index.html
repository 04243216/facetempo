<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaceTempo · 3D Drive Preview</title>
  <style>
    :root {
      --bg: #070d19;
      --panel: #0d1626;
      --line: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: "Inter", "Microsoft YaHei", system-ui, sans-serif; }
    #app { display: flex; height: 100vh; overflow: hidden; }
    #stage { position: relative; flex: 1; min-width: 0; }
    #scene { display: block; width: 100%; height: 100%; }
    #panel {
      width: 380px; flex: 0 0 380px; background: var(--panel);
      border-left: 1px solid var(--line); padding: 22px 22px 16px;
      display: flex; flex-direction: column; gap: 14px; overflow: hidden;
    }
    h1 { font-size: 1.35rem; margin: 0; letter-spacing: .02em; }
    .sub { margin: 0; color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
      font-size: .78rem; color: var(--muted); }
    .meta b { color: var(--text); font-weight: 600; }
    .controls { display: flex; gap: 8px; align-items: center; }
    button {
      background: #1d4ed8; color: #fff; border: 0; border-radius: 8px;
      padding: 8px 12px; font-size: .82rem; cursor: pointer;
    }
    button:hover { background: #2563eb; }
    select, input[type="range"] { accent-color: var(--accent); }
    select { background: #111c30; color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 6px; font-size: .8rem; }
    input[type="range"] { width: 100%; }
    .readout { display: flex; justify-content: space-between; font-size: .78rem;
      color: var(--muted); font-variant-numeric: tabular-nums; }
    .readout b { color: var(--accent); font-weight: 600; }
    .section-title { font-size: .78rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: .08em; margin: 2px 0 -4px; }
    .channels { flex: 1; min-height: 0; overflow-y: auto; padding-right: 4px;
      display: flex; flex-direction: column; gap: 3px; }
    .chan { display: grid; grid-template-columns: 122px 1fr 42px; gap: 8px;
      align-items: center; font-size: .72rem; color: var(--muted); }
    .chan .bar { height: 5px; background: #16233a; border-radius: 3px; overflow: hidden; }
    .chan .bar i { display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #1d4ed8, #38bdf8); }
    .chan .val { text-align: right; color: #cbd5e1; font-variant-numeric: tabular-nums; }
    .hint { margin: 0; font-size: .72rem; color: #64748b; line-height: 1.5; }
    #error { position: absolute; inset: 0; display: none; place-items: center;
      text-align: center; padding: 40px; color: #fca5a5; font-size: .95rem;
      background: rgba(7, 13, 25, .88); line-height: 1.7; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px;
      background: rgba(56, 189, 248, .12); color: var(--accent); font-size: .7rem; }
  </style>
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="scene"></canvas>
      <div id="error"></div>
    </div>

    <aside id="panel">
      <div>
        <h1>FaceTempo <span class="badge">W7</span></h1>
        <p class="sub">Blendshape JSON → 3D 驱动预览。数据来自真人视频的 52 通道导出。</p>
      </div>

      <div class="meta" id="meta"></div>

      <div class="controls">
        <button id="play">⏸ 暂停</button>
        <select id="speed">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
        </select>
      </div>
      <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />

      <div class="readout">
        <span>frame <b id="frame">0</b></span>
        <span><b id="time">0.00</b> s</span>
      </div>

      <div class="section-title">52 channels</div>
      <div class="channels" id="channels"></div>

      <p class="hint">空格播放/暂停 · 拖动进度条拖动时间轴。模型为程序化示意头，眼睑、嘴角、下颌、眉毛由对应通道实时驱动。</p>
    </aside>
  </div>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/GLTFLoader.js"></script>
  <script src="app.js"></script>
</body>
</html>
